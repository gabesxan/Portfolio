name: portfolio-local
services:
  mysql:
    image: mysql:8.4
    container_name: portfolio-mysql-local
    ports:
      - '127.0.0.1:3307:3306'
    environment:
      MYSQL_ROOT_PASSWORD: portfolio-root-local-only
      MYSQL_DATABASE: portfolio
      MYSQL_USER: portfolio
      MYSQL_PASSWORD: portfolio-local-only
    volumes:
      - portfolio_mysql:/var/lib/mysql
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          'localhost',
          '-uroot',
          '-pportfolio-root-local-only',
        ]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  portfolio_mysql:
    name: portfolio_mysql_local
